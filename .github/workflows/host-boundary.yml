name: Host contract boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/host-boundary/check.py
      - run: python -m unittest discover -s scripts/host-boundary -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p skiff-host-api -p skiff-client --test contract --test host_contract --test local_contract --test local_host --test session_screen --test session_inventory --test session_updates
