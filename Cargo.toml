[workspace]
resolver = "2"
members = [
  "crates/skiff-core",
  "crates/skiff-client",
  "crates/skiffd",
  "crates/skiff-cli",
  "apps/desktop/src-tauri",
]
# Vendored dependencies are patched in, not built and tested as members.
exclude = ["vendor"]

[workspace.package]
version = "1.5.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/solutionscay/skiff"

[workspace.dependencies]
skiff-core = { path = "crates/skiff-core" }
skiff-client = { path = "crates/skiff-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
base64 = "0.22"
dirs = "6"
toml = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }

# skiffd reload (#69) hands the whole terminal over to a new binary: both
# screens, history, cursors, modes, keyboard stacks and the parser mid-sequence.
# The upstream crates keep that state private, so these copies add a save and
# restore API. Each patched spot carries a `skiff:` comment.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }

# Size first. The emulator runs about 8% slower than at opt-level 3
# (~100 MB/s of output); keystroke latency is in the webview's frames.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Dev builds feel like release ones: every byte of terminal output runs
# through the emulator, JSON and base64 code in these crates.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
