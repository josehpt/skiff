[package]
name = "skiff-core"
description = "Shared types, wire protocol, and config for Skiff"
# The skiffd version, apart from the app. skiffd and skiff-core keep it in step.
version = "0.6.23"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
dirs.workspace = true
# preserve_order: `[skiff_agent.tasks]` shows in file order.
toml = { workspace = true, features = ["preserve_order"] }
anyhow.workspace = true
toml_edit = "0.25.15"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
