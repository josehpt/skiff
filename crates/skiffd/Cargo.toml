[package]
name = "skiffd"
description = "Skiff daemon: owns every PTY and serves clients over a Unix socket"
# The skiffd version, apart from the app. skiffd and skiff-core keep it in step.
version = "0.6.22"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "skiffd"
path = "src/main.rs"

[dependencies]
skiff-core.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
portable-pty.workspace = true
uuid.workspace = true
dirs.workspace = true
alacritty_terminal = "0.26"
postcard = { version = "1", features = ["use-std"] }
polling = "3"

[dev-dependencies]
skiff-client.workspace = true
